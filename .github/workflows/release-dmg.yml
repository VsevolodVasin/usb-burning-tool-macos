name: Release DMG

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: brew install create-dmg
      - name: Version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      - env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: chmod +x scripts/build_dmg.sh && ./scripts/build_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ubt-dmg
          path: dist/USB-Burning-Tool-*.dmg
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG=$(ls dist/USB-Burning-Tool-*.dmg | head -1)
          gh release upload "${GITHUB_REF_NAME}" "$DMG" --clobber || \
          gh release create "${GITHUB_REF_NAME}" "$DMG" --title "USB Burning Tool ${GITHUB_REF_NAME}" --generate-notes
